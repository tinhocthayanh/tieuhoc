<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LV2 TRAINING 01</title>
<style>
  :root{
    --navy:rgb(47,85,151);
    --navy-dark:rgb(32,60,108);
    --blue:#1a56d6;
    --blue-light:#3f7ee8;
    --grey-line:#aab8c9;
    --grey-bg:#eef1f5;
    --text:#1f2430;
    --border:#c7cfd9;
    --green:#1e8e4a;
    --red:#c0392b;
    --gold:#d8a51d;
    --header-height: 70px;
    --footer-height: 70px;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    color:var(--text);
    background:#fff;
    height:100%;
    overflow:hidden;
  }
  
  #app-wrapper {
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f0f2f5;
  }
  
  #app {
    width: 100%;
    max-width: 1280px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #fff;
    position: relative;
    overflow: hidden;
  }
  
  .hidden{display:none !important;}
  #quiz-screen{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    height:100%;
    overflow:hidden;
  }
  #resultScreen{
    flex:1;
    min-height:0;
    overflow-y:auto;
    height:100%;
  }

  .quiz-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 24px;
    min-height: var(--header-height);
    max-height: var(--header-height);
    height: var(--header-height);
    flex-shrink: 0;
    background: #fff;
    border-bottom: 1px solid #e4e8ee;
    z-index: 10;
    gap: 8px;
  }
  .quiz-header .q-count{
    font-size:16px;
    font-weight:700;
    color:#111;
    white-space:nowrap;
  }
  .quiz-header .q-timer{
    font-size:16px;
    font-weight:400;
    color:#111;
    white-space:nowrap;
  }
  .quiz-header .q-timer.warn{color:var(--red);font-weight:700;}

  .progress-track{
    height:12px;
    width:100%;
    background:var(--grey-line);
    flex-shrink: 0;
  }
  .progress-fill{
    height:100%;
    background:var(--navy);
    transition:width .25s ease;
  }

  .dots-row{
    display:flex;
    justify-content:center;
    gap:8px;
    padding:8px 0 6px 0;
    flex-shrink: 0;
    min-height: 30px;
  }
  .dots-row .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:#d7dee6;
    border:1px solid #d7dee6;
  }
  .dots-row .dot.filled{background:var(--navy);border-color:var(--navy);}

  /* ===== TRẠNG THÁI ĐÁP ÁN SAU KHI CHỐT ===== */
  .option-row.answer-correct, .option-image-card.answer-correct, .tf-btn.answer-correct{border-color:var(--green) !important;background:#eafaf0 !important;color:var(--green) !important;}
  .option-row.answer-wrong, .option-image-card.answer-wrong, .tf-btn.answer-wrong{border-color:var(--red) !important;background:#fdecea !important;color:var(--red) !important;}
  .option-row.answer-correct .opt-label, .option-row.answer-wrong .opt-label{font-weight:700;}
  .gtf-radio.answer-correct{border-color:var(--green) !important;background:#eafaf0 !important;}
  .gtf-radio.answer-correct::after{background:var(--green) !important;}
  .gtf-radio.answer-wrong{border-color:var(--red) !important;background:#fdecea !important;}
  .gtf-radio.answer-wrong::after{background:var(--red) !important;}
  .left-item.answer-correct{border-color:var(--green) !important;background:#eafaf0 !important;color:var(--green) !important;}
  .left-item.answer-wrong{border-color:var(--red) !important;background:#fdecea !important;color:var(--red) !important;}
  .answer-progress{margin-top:10px;font-size:13px;color:#555;}
    /* ===== FEEDBACK ĐÚNG / SAI CHO TỪNG CÂU ===== */
  .answer-feedback{
    margin:16px 0 4px;
    padding:12px 16px;
    border-radius:10px;
    border:2px solid transparent;
    font-size:16px;
    font-weight:700;
    line-height:1.45;
    display:flex;
    align-items:center;
    gap:10px;
    max-width:900px;
    box-sizing:border-box;
  }
  .answer-feedback.correct{
    background:#e8f7ee;
    color:#176b3a;
    border-color:#79c99a;
  }
  .answer-feedback.wrong{
    background:#fdecec;
    color:#a52828;
    border-color:#e58a8a;
  }
  .answer-feedback.unanswered{
    background:#fff7df;
    color:#7a5600;
    border-color:#f0c75e;
  }
  .answer-feedback.unanswered .feedback-icon{background:#e0a800;}
  .answer-feedback .feedback-icon{
    width:28px;height:28px;min-width:28px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    color:#fff;font-size:17px;font-weight:800;
  }
  .answer-feedback.correct .feedback-icon{background:#1e8e4a;}
  .answer-feedback.wrong .feedback-icon{background:#c0392b;}

  /* ===== NỀN THÔNG BÁO CHƯA HOÀN THÀNH ===== */
  #confirmSubmitModal{
    background:rgba(15,25,45,.72) !important;
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
  }
  #confirmSubmitModal .modal-box{
    background:#ffffff !important;
    color:#1f2430 !important;
    border:2px solid #d8dee8 !important;
    box-shadow:0 18px 50px rgba(0,0,0,.28) !important;
  }
  #confirmSubmitModal h2{
    background:#fff4d6;
    border:1px solid #f0cf73;
    border-radius:10px;
    padding:10px 12px;
    margin:8px 0 12px !important;
  }
  #confirmSubmitModal #confirmSubmitText{
    background:#f4f7fb;
    border:1px solid #d8e0ea;
    border-radius:8px;
    padding:10px 12px;
    color:#26364a !important;
  }

  .quiz-body{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px 24px;
    background:#fff;
  }
  .zoom-content{
    transform-origin: top left;
    width:100%;
    height:auto;
  }
  .question-text{
    font-size:16px;
    line-height:1.5;
    margin:4px 0 4px 0;
    color:#111;
  }
  .question-note{
    font-size:14px;
    color:#333;
    margin:2px 0 4px 0;
  }
  .content-wrap{padding-top:12px;}

  .option-list{
    display:flex;
    flex-direction:column;
    gap:16px;
    max-width:640px;
  }
  .option-row{
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    font-size:16px;
  }
  .option-row input{
    width:18px;
    height:18px;
    accent-color:var(--blue);
    cursor:pointer;
    flex:none;
  }
  .option-row .opt-label{user-select:none;}
  .option-row.selected .opt-label{font-weight:600;}

  .option-grid-image{display:flex;gap:16px;flex-wrap:wrap;}
  .option-image-card{
    border:2px solid var(--border);
    border-radius:6px;
    padding:6px;
    cursor:pointer;
    width:150px;
    text-align:center;
  }
  .option-image-card img{
    width:100%;
    border-radius:4px;
    display:block;
    margin-bottom:4px;
  }
  .option-image-card.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(26,86,214,.25);}

  .single-with-media{
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .single-media-box{flex:0 0 auto;}
  .single-media-box + .option-list{padding-top:4px;}

  .tf-buttons{
    display:flex;
    gap:14px;
    max-width:360px;
  }
  .tf-btn{
    flex:1;
    padding:12px 0;
    text-align:center;
    border:2px solid var(--border);
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
    font-weight:600;
    background:#fff;
  }
  .tf-btn.selected{border-color:var(--blue);background:#eaf1ff;color:var(--blue);}

  .group-tf-table{
    width:100%;
    border-collapse:collapse;
    max-width:900px;
    font-size:14px;
  }
  .group-tf-table th{
    text-align:center;
    font-weight:700;
    padding:4px 12px;
    border-bottom:2px solid var(--border);
  }
  .group-tf-table td{
    padding:8px 12px;
    border-bottom:1px solid #e4e8ee;
    vertical-align:middle;
  }
  .group-tf-table td.statement{width:60%;}
  .gtf-choice{display:flex;justify-content:center;}
  .gtf-radio{
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid var(--grey-line);
    cursor:pointer;
    display:inline-block;
    position:relative;
  }
  .gtf-radio.checked{border-color:var(--blue);}
  .gtf-radio.checked::after{
    content:"";
    position:absolute;
    top:2px;
    left:2px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--blue);
  }

  .match-wrap{
    display:flex;
    gap:0;
    border-top:1px solid var(--border);
    max-height: 400px;
    overflow: auto;
  }
  .match-col{
    flex:1;
    padding:16px 20px;
    position:relative;
  }
  .match-col.left-col{border-right:1px solid var(--border);}
  .match-col h3{
    font-size:18px;
    margin:0 0 12px 0;
    font-weight:700;
  }
  .left-items{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-width:320px;
  }
  .left-item{
    border:2px solid var(--blue);
    border-radius:6px;
    padding:10px 12px;
    font-size:14px;
    cursor:grab;
    background:#fff;
    user-select:none;
  }
  .left-item.used{opacity:.35;cursor:not-allowed;border-style:dashed;}
  .left-item.selected{background:#eaf1ff;box-shadow:0 0 0 2px rgba(26,86,214,.35);}
  .left-item.dragging{opacity:.5;}

  .right-groups-row{
    display:flex;
    gap:24px;
    flex-wrap:wrap;
  }
  .right-group{
    display:flex;
    flex-direction:column;
    gap:8px;
    min-width:200px;
  }
  .right-group-label-col{
    font-size:15px;
    font-weight:700;
    margin-bottom:2px;
  }
  .right-group-inline{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:2px;
  }
  .right-group-inline .right-group-label-inline{
    font-size:15px;
    font-weight:700;
    min-width:90px;
  }
  .drop-slot{
    border:2px dashed #7fa6f0;
    border-radius:6px;
    min-height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:#8a93a3;
    padding:4px 8px;
    min-width:160px;
    cursor:pointer;
  }
  .drop-slot.filled{
    border-style:solid;
    color:var(--text);
    border-color:var(--blue);
    background:#f5f8ff;
    font-weight:600;
  }
  .drop-slot.correct{border-color:var(--green);background:#eafaf0;color:var(--green);}
  .drop-slot.wrong{border-color:var(--red);background:#fdecea;color:var(--red);}
  .drop-slot.drag-over{background:#dce8ff;}

  .position-wrap{
    max-width:960px;
    position:relative;
    display:inline-block;
    margin-top:4px;
  }
  .position-target-area{
    position:relative;
    cursor:crosshair;
    border:1px solid #d8dde5;
    display: inline-block;
    max-width: 100%;
  }
  .position-target-area img{
    display:block;
    max-width:100%;
    height:auto;
  }
  .click-marker{
    position:absolute;
    width:22px;
    height:22px;
    margin-left:-11px;
    margin-top:-11px;
    border-radius:50%;
    border:3px solid var(--blue);
    background:rgba(26,86,214,.25);
    pointer-events:none;
  }
  .click-marker.correct{border-color:var(--green);background:rgba(30,142,74,.25);}
  .click-marker.wrong{border-color:var(--red);background:rgba(192,57,43,.25);}
  .target-reveal{
    position:absolute;
    border:2px dashed var(--green);
    background:rgba(30,142,74,.12);
    pointer-events:none;
  }

  .mockup-img-wrap{
    display:inline-block;
    max-width:480px;
    width:100%;
  }
  .mockup-img-wrap img{
    display:block;
    max-width:100%;
    height:auto;
    border:1px solid #d8dde5;
    border-radius:4px;
  }
  .img-missing{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    width:100%;
    max-width:520px;
    min-height:140px;
    border:2px dashed #c7cfd9;
    border-radius:6px;
    color:#8a93a3;
    font-size:13px;
    padding:16px;
    background:#fafbfc;
  }


  /* Thông báo đúng / sai cho từng câu */
  .question-feedback{display:flex;align-items:center;gap:10px;width:100%;max-width:760px;margin:18px 0 8px;padding:12px 16px;border-radius:10px;border:2px solid;font-size:15px;font-weight:700;line-height:1.45;animation:feedbackIn .2s ease-out;}
  .question-feedback.correct{color:var(--green);background:#eafaf0;border-color:#8fd3aa;}
  .question-feedback.wrong{color:var(--red);background:#fdecea;border-color:#e7a29a;}
  .question-feedback .feedback-icon{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:currentColor;color:#fff;font-size:16px;}
  .question-feedback.correct .feedback-icon::before{content:'✓';}
  .question-feedback.wrong .feedback-icon::before{content:'✕';}
  @keyframes feedbackIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}

  /* Sửa nền cửa sổ Xem lại câu sai */
  #reviewModal{background:rgba(15,20,30,.68);}
  #reviewModal #reviewBox{background:#fff !important;color:var(--text);border:1px solid #d9e0e8 !important;box-shadow:0 18px 45px rgba(0,0,0,.22) !important;max-height:calc(100vh - 40px);overflow-y:auto;}
  #reviewModal #reviewBox .question-text{background:#f7f9fc;border-left:4px solid var(--navy);border-radius:6px;padding:12px 14px;}
  #reviewModal #reviewBox .review-answer-line{background:#fff;padding:9px 12px;border-radius:6px;margin:6px 0;border:1px solid #e4e8ee;}

  .quiz-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 24px;
    min-height: var(--footer-height);
    max-height: var(--footer-height);
    height: var(--footer-height);
    flex-shrink: 0;
    border-top:1px solid #e4e8ee;
    background: #fff;
    gap: 8px;
  }
  .link-summary{
    color:var(--blue);
    text-decoration:underline;
    cursor:pointer;
    font-size:14px;
    background:none;
    border:none;
    padding:0;
  }
  .footer-buttons{
    display:flex;
    gap:8px;
    flex-wrap:nowrap;
  }
  .btn{
    padding:10px 22px;
    border-radius:5px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border:2px solid var(--navy);
    white-space:nowrap;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:hover{background:var(--navy-dark);}
  .btn-secondary{background:#fff;color:var(--navy);}
  .btn-secondary:hover{background:#f0f2f6;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,20,30,.65);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    padding:20px;
  }
  
  /* =========================================================
     NỀN ĐĂNG NHẬP: BẦU TRỜI XANH + MÂY CHUYỂN ĐỘNG
     Chỉ áp dụng cho #loginModal, không ảnh hưởng màn hình làm bài.
     ========================================================= */
  #loginModal{
    overflow:hidden;
    isolation:isolate;
    background:
      radial-gradient(circle at 78% 16%, rgba(255,255,255,.34) 0 7%, transparent 7.5%),
      linear-gradient(180deg,#4ea6f7 0%,#78c5ff 45%,#c8edff 100%);
  }

  /* Các đám mây chỉ thuộc layer nền, tuyệt đối không đè lên form */
  #loginModal > .sky-cloud{
    z-index:0 !important;
  }
  #loginModal > .modal-box{
    position:relative;
    z-index:10 !important;
  }

  #loginModal::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 18% 20%, rgba(255,255,255,.20) 0 8%, transparent 8.5%),
      radial-gradient(circle at 86% 72%, rgba(255,255,255,.16) 0 12%, transparent 12.5%);
    animation:skyGlow 8s ease-in-out infinite alternate;
  }

  .sky-cloud{
    position:absolute;
    width:170px;
    height:48px;
    border-radius:50px;
    background:rgba(255,255,255,.88);
    filter:drop-shadow(0 7px 8px rgba(38,105,160,.10));
    z-index:0;
    pointer-events:none;
    opacity:.9;
  }
  .sky-cloud::before,
  .sky-cloud::after{
    content:"";
    position:absolute;
    border-radius:50%;
    background:inherit;
  }
  .sky-cloud::before{
    width:72px;height:72px;
    left:24px;top:-35px;
  }
  .sky-cloud::after{
    width:58px;height:58px;
    right:25px;top:-25px;
  }
  .cloud-1{top:13%;left:-190px;animation:cloudMove1 28s linear infinite;}
  .cloud-2{top:29%;left:-230px;transform:scale(.72);animation:cloudMove2 38s linear infinite 4s;}
  .cloud-3{top:66%;left:-200px;transform:scale(.58);opacity:.65;animation:cloudMove3 45s linear infinite 8s;}
  .cloud-4{top:82%;left:-250px;transform:scale(.82);opacity:.58;animation:cloudMove4 34s linear infinite 12s;}

  @keyframes cloudMove1{
    from{left:-220px}
    to{left:calc(100% + 220px)}
  }
  @keyframes cloudMove2{
    from{left:-260px}
    to{left:calc(100% + 260px)}
  }
  @keyframes cloudMove3{
    from{left:-240px}
    to{left:calc(100% + 240px)}
  }
  @keyframes cloudMove4{
    from{left:-280px}
    to{left:calc(100% + 280px)}
  }
  @keyframes skyGlow{
    from{transform:scale(1);opacity:.75}
    to{transform:scale(1.06);opacity:1}
  }

  /* Nhân vật trang trí: thay src bằng link ảnh PNG/GIF/WebP của bạn.
     pointer-events:none để tuyệt đối không cản thao tác với form. */
  .login-character{
    position:absolute;
    z-index:2;
    pointer-events:none;
    user-select:none;
    object-fit:contain;
    border:0 !important;
    border-radius:0 !important;
    box-shadow:none !important;
    background:transparent !important;
    animation:characterFloat 4s ease-in-out infinite;
  }
  .login-character.left{
    width:min(210px,18vw);
    max-width:210px;
    left:2.5%;
    bottom:5%;
  }
  .login-character.right{
    width:min(190px,17vw);
    max-width:190px;
    right:2.5%;
    bottom:7%;
    animation-delay:-1.4s;
  }
  .login-character.top-right{
    width:min(125px,12vw);
    max-width:125px;
    right:10%;
    top:7%;
    animation-delay:-2.2s;
  }
  @keyframes characterFloat{
    0%,100%{transform:translateY(0) rotate(-1deg)}
    50%{transform:translateY(-9px) rotate(1deg)}
  }

  /* =========================================================
     CẬP NHẬT GIAO DIỆN ĐĂNG NHẬP (CARTOON & 3D BUTTON)
     ========================================================= */

  #loginModal .modal-box {
    z-index:10;
    background:rgba(255,255,255,.96);
    border-radius: 24px;
    border: 4px solid var(--navy-dark);
    box-shadow: 0 12px 25px rgba(0,0,0,0.25), 0 8px 0 var(--navy);
    padding: 50px 32px 24px 32px;
    position: relative;
    max-width: 520px;
    width: 100%;
    margin-top: 60px; /* Nhường chỗ cho nhân vật */
  }

  .login-decor {
    position: absolute;
    top: -18%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    z-index: 10;
  }

  .login-decor img {
    width: 150px;
    height: 150px;
    object-fit: cover;
    /* Bạn có thể đổi đường dẫn URL bằng link ảnh nhân vật hoạt hình thật ở đây */
    background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150"><rect width="150" height="150" fill="%23eaf1ff"/><text x="50%" y="45%" font-size="14" font-weight="bold" text-anchor="middle" font-family="Arial" fill="%232f5597">Ảnh nhân vật</text><text x="50%" y="60%" font-size="12" text-anchor="middle" font-family="Arial" fill="%232f5597">(Gán link img)</text></svg>') no-repeat center center;
    border: 6px solid #fff;
    border-radius: 50%;
    box-shadow: 0 6px 0 var(--border), 0 10px 15px rgba(0,0,0,0.15);
    background-color: #eaf1ff;
  }

  #loginModal h2 {
    text-align: center;
    font-size: 26px;
    color: var(--blue);
    text-transform: uppercase;
    font-weight: 800;

<div id="app-wrapper">
<div id="app">

  <!-- ===== LOGIN MODAL ===== -->

/* =========================================================

const DEFAULT_STUDENTS = [

];

/* =========================================================
   QUIZ DATA & CẤU HÌNH
   ========================================================= */
const IMAGES = {
  email: "email.png",
  browser: "browser.png",
};

const SERVER_CONFIG = {
  url: "https://script.google.com/macros/s/AKfycbxMV0t_gvxlfcFPct-mDywCPTwrJIcEcBYPAQ9D1_VWEpQOFFg1HryClHUgZmmhTeOO/exec",
  fileName: "OT1_TR_LV2",
  schoolName: ""
};

function imgWithFallback(src, label, width, height){
  const parts = [];
  if(width) parts.push(`width:${width}px`);
  if(height) parts.push(`height:${height}px`);
  if(width && height) parts.push('object-fit:contain');
  const style = parts.length ? ` style="${parts.join(';')}"` : '';
  if(!src) return `<div class="img-missing"${style}>⚠ Chưa gắn ảnh cho: ${label}</div>`;
  return `<img src="${src}" alt="${label}" data-key="${label}"${style} onerror="window.__imgFallback(this)">`;
}
window.__imgFallback = function(imgEl){
  const div = document.createElement('div');
  div.className = 'img-missing';
  div.textContent = '⚠ Không tải được ảnh: ' + (imgEl.getAttribute('data-key')||'') + ' — kiểm tra lại đường link trong biến IMAGES/quizData.';
  imgEl.replaceWith(div);
};

/* ---------------------------------------------------------
   LƯU Ý: Phần quizData đã được rút gọn để code nhẹ nhàng hơn.
   Bạn hãy copy & paste nguyên biến const quizData = [...]
   từ file gốc của bạn vào thay thế mảng rỗng dưới đây nhé! 
--------------------------------------------------------- */

   {
        id: 1, type: "single",
        question: "Em hãy cho biết, tùy chọn nào sau đây là thành phần quan trọng nhất được sử dụng để chạy các ứng dụng?",
        options: ["Thẻ SIM", "Bộ nhớ", "Card màn hình", "Bộ lưu trữ"],
        answer: 1
    },

    content.style.transform = `scale(${scale})`;
    content.style.transformOrigin = 'top left';
    content.style.width = `${100 / scale}%`;
  }
  document.getElementById('zoomLevel').textContent = currentZoom + '%';
  try { localStorage.setItem('quizZoom', currentZoom); } catch(e) {}
}

function zoomIn() { applyZoom(currentZoom + ZOOM_STEP); }
function zoomOut() { applyZoom(currentZoom - ZOOM_STEP); }

function loadZoomSetting() {
  try {
    const saved = localStorage.getItem('quizZoom');
    if (saved) {
      const zoom = parseInt(saved);
      if (!isNaN(zoom) && zoom >= MIN_ZOOM && zoom <= MAX_ZOOM) {
        applyZoom(zoom);
        return;
      }
    }
  } catch(e) {}
  applyZoom(100);
}

   ========================================================= */
let studentData = [];
let classList = [];
let schoolList = [];
let currentClassStudents = []; 

function parseCSV(csvText) {
  const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
  if (lines.length < 2) return null;
  
  const header = lines[0].split(',').map(h => h.trim().toLowerCase());
  let nameIdx = -1, classIdx = -1, schoolIdx = -1;
  
  const nameKeywords = ['tên học sinh', 'tên', 'name', 'học sinh', 'student', 'full name', 'ten', 'ho ten', 'họ tên'];
  for (const kw of nameKeywords) {
    nameIdx = header.findIndex(h => h.includes(kw));
    if (nameIdx !== -1) break;
  }
  
  const classKeywords = ['lớp', 'class', 'lop', 'grade', 'classe'];
  for (const kw of classKeywords) {
    classIdx = header.findIndex(h => h.includes(kw));
    if (classIdx !== -1) break;
  }

  const schoolKeywords = ['trường', 'school', 'truong'];
  for (const kw of schoolKeywords) {
    schoolIdx = header.findIndex(h => h.includes(kw));
    if (schoolIdx !== -1) break;
  }
  
  if (nameIdx === -1) nameIdx = 0;
  if (classIdx === -1) classIdx = 1;
  
  const result = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(c => c.trim());
    if (cols.length > Math.max(nameIdx, classIdx)) {
      const name = cols[nameIdx] || '';
      const cls = cols[classIdx] || '';
      const school = schoolIdx !== -1 ? (cols[schoolIdx] || '') : '';
      if (name && cls) {
        result.push({ name: name.trim(), class: cls.trim(), school: school.trim() });
      }
    }
  }
  return result.length > 0 ? result : null;
}

function showFileStatus(message, type = 'info') {
  const el = document.getElementById('fileStatus');
  if (el) {
    el.textContent = message;
    el.className = 'file-status ' + type;
  }
}

function loadStudentData() {
  const loadingEl = document.getElementById('loginLoading');
  const formEl = document.getElementById('loginForm');
  
  loadingEl.style.display = 'block';
  formEl.style.display = 'none';
  
  fetch('students.csv')
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      return response.text();
    })
    .then(csvText => {
      const parsed = parseCSV(csvText);
      if (parsed && parsed.length > 0) {
        studentData = parsed;
        showFileStatus(`✅ Đã tải thành công ${studentData.length} học sinh`, 'success');
        finalizeStudentData();
      } else {
        throw new Error('Dữ liệu CSV không hợp lệ hoặc trống');
      }
    })
    .catch(err => {
      showFileStatus(`⚠ Không tìm thấy students.csv, dùng dữ liệu mẫu.`, 'error');
      studentData = DEFAULT_STUDENTS.slice();
      finalizeStudentData();
    });
}

function finalizeStudentData() {
  const seen = new Set();
  studentData = studentData.filter(s => {
    const key = s.school + '|' + s.name + '|' + s.class;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  
  studentData.sort((a, b) => a.name.localeCompare(b.name, 'vi'));
  schoolList = [...new Set(studentData.map(s => s.school || ''))].sort((a, b) => a.localeCompare(b, 'vi'));
  
  document.getElementById('loginLoading').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
  populateSchoolSelect();
}

function populateSchoolSelect() {
  const select = document.getElementById('schoolSelect');
  const schoolGroup = document.getElementById('schoolGroup');
  select.innerHTML = '';

  if (schoolList.length === 0 || (schoolList.length === 1 && schoolList[0] === '')) {
    schoolGroup.classList.add('hidden');
    populateClassSelect(''); 
    return;
  }

  schoolGroup.classList.remove('hidden');
  select.innerHTML = '<option value="">-- Chọn trường --</option>';
  schoolList.forEach(sch => {
    const opt = document.createElement('option');
    opt.value = sch;
    opt.textContent = sch;
    select.appendChild(opt);
  });
}

function populateClassSelect(selectedSchool) {
  const select = document.getElementById('classSelect');
  const pool = selectedSchool
    ? studentData.filter(s => s.school === selectedSchool)
    : studentData;
  classList = [...new Set(pool.map(s => s.class))].sort();

  select.innerHTML = '';
  if (classList.length === 0) {
    select.innerHTML = '<option value="">-- Không có lớp nào --</option>';
    select.disabled = true;
    return;
  }
  select.disabled = false;
  select.innerHTML = '<option value="">-- Chọn lớp --</option>';
  classList.forEach(cls => {
    const opt = document.createElement('option');
    opt.value = cls;
    opt.textContent = cls;
    select.appendChild(opt);
  });
}

   ĐĂNG NHẬP

function normalizeText(str) {
  return (str || '')
    .toString()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/đ/g, 'd');
}

function renderStudentOptions(students) {
  const studentSelect = document.getElementById('studentSelect');
  const prevValue = studentSelect.value;

  if (students.length === 0) {
    studentSelect.innerHTML = '<option value="">-- Không tìm thấy học sinh --</option>';
    studentSelect.disabled = true;
    return;
  }

  studentSelect.disabled = false;
  studentSelect.innerHTML = '<option value="">-- Chọn học sinh --</option>';
  students.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.name;
    opt.textContent = s.name;
    studentSelect.appendChild(opt);
  });

  if (prevValue && students.some(s => s.name === prevValue)) {
    studentSelect.value = prevValue;
  } else if (students.length === 1) {
    studentSelect.value = students[0].name;
  }
}

function getFirstLetterOfGivenName(fullName) {
  const parts = (fullName || '').trim().split(/\s+/);
  const lastWord = parts.length > 0 ? parts[parts.length - 1] : '';
  const normalized = normalizeText(lastWord);
  return normalized.charAt(0).toUpperCase();
}

/* =========================================================
   CÁC HÀM XỬ LÝ QUIZ (GIỮ NGUYÊN HOÀN TOÀN TỪ CODE GỐC)
   ========================================================= */
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initShuffleOrders() {
  state.shuffleOrders = {};
  quizData.forEach(q => {
    if (q.type === 'single' || q.type === 'multiple') {
      state.shuffleOrders[q.id] = shuffleArray(q.options.map((_, i) => i));
    } else if (q.type === 'tf') {
      state.shuffleOrders[q.id] = shuffleArray([0, 1]);
    } else if (q.type === 'group_tf') {
      state.shuffleOrders[q.id] = q.items.map((_, i) => i);
    } else if (q.type === 'match') {
      state.shuffleOrders[q.id] = {
        left: shuffleArray(q.left.map((_, i) => i)),
        right: shuffleArray(q.right.map((_, i) => i))
      };
    }
  });
}
initShuffleOrders();

function fmtTime(sec) {
  sec = Math.max(0, sec);
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const pad = n => n.toString().padStart(2, '0');
  return pad(h) + ":" + pad(m) + ":" + pad(s);
}

function startTimer() {
  clearInterval(state.timerHandle);
  state.timerHandle = setInterval(() => {
    if (state.finished) { clearInterval(state.timerHandle); return; }
    state.timeLeft--;
    updateTimerDisplay();
    if (state.timeLeft <= 0) {
      clearInterval(state.timerHandle);
      finishQuiz();
    }
  }, 1000);
}

function updateTimerDisplay() {
  const el = document.getElementById('qTimer');
  if (el) {
    el.textContent = "Thời gian còn: " + fmtTime(state.timeLeft);
    el.classList.toggle('warn', state.timeLeft <= 60);
  }
}

function currentQuestion() { return quizData[state.current]; }

function isAnswered(q) {
  const a = state.answers[q.id];
  if (a === undefined || a === null) return false;
  if (q.type === 'single' || q.type === 'tf') return true;
  // Câu nhiều lựa chọn chỉ hoàn thành khi đã chọn ĐỦ số đáp án yêu cầu.
  if (q.type === 'multiple') return Array.isArray(a) && a.length === (Array.isArray(q.answers) ? q.answers.length : 0);
  if (q.type === 'group_tf') return Object.keys(a).length === q.items.length;
  if (q.type === 'match') return Object.keys(a).length === q.left.length;
  if (q.type === 'position') return true;
  return false;
}

function isQuestionLocked(q) {
  return !!(state.lockedQuestions && state.lockedQuestions[q.id]);
}

function render() {
  const q = currentQuestion();
  const qCountEl = document.getElementById('qCount');
  const progressFill = document.getElementById('progressFill');
  const btnBack = document.getElementById('btnBack');
  const btnNext = document.getElementById('btnNext');

  if (qCountEl) qCountEl.textContent = `Câu hỏi: ${state.current + 1}/${quizData.length}`;
  if (progressFill) {
    const pct = ((state.current + 1) / quizData.length) * 100;
    progressFill.style.width = pct + "%";
  }
  updateTimerDisplay();
  renderDots(q);
  renderQuestionText(q);
  renderContent(q);
  if (btnBack) btnBack.disabled = state.current === 0;
  if (btnNext) btnNext.textContent = (state.current === quizData.length - 1) ? "Hoàn thành" : "Tiếp theo";
}

function renderDots(q) {
  const row = document.getElementById('dotsRow');
  if (!row) return;
  let count = 0;
  if (q.type === 'match') count = q.left.length;
  else if (q.type === 'group_tf') count = q.items.length;
  else if (q.type === 'position') count = 1;
  else { row.classList.add('hidden'); row.innerHTML = ''; return; }
  row.classList.remove('hidden');
  row.innerHTML = '';
  const answeredCount = subAnswerCount(q);
  for (let i = 0; i < count; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i < answeredCount ? ' filled' : '');
    row.appendChild(d);
  }
}

function subAnswerCount(q) {
  const a = state.answers[q.id];
  if (!a) return 0;
  if (q.type === 'match' || q.type === 'group_tf') return Object.keys(a).length;
  if (q.type === 'position') return 1;
  return 0;
}

function renderQuestionText(q) {
  const box = document.getElementById('questionText');
  if (!box) return;
  let html = `<div class="question-text">${q.question}</div>`;
  if (q.note) html += `<div class="question-note">${q.note}</div>`;
  box.innerHTML = html;
}

function getAnswerFeedback(q){
  // Câu đã chốt đáp án luôn hiển thị kết quả khi quay lại.
  if(!state.feedbackShown && !isQuestionLocked(q)) return '';

  if(!isAnswered(q)){
    return `<div class="answer-feedback unanswered">
      <span class="feedback-icon">😜</span>
      <span><strong>Ơ kìa!</strong> Bạn chưa chọn đáp án đâu nhé. Đừng để câu hỏi đứng chờ một mình! 😄</span>
    </div>`;
  }

  const r = evaluateQuestion(q);
  if(q.type === 'group_tf' || q.type === 'match'){
    return r.fullyCorrect
      ? `<div class="answer-feedback correct">
          <span class="feedback-icon">🎉</span>
          <span><strong>Quá đỉnh!</strong> Chính xác ${r.totalUnits}/${r.totalUnits} ý. Tuyệt vời, chiến tiếp nào! 🚀</span>
        </div>`
      : `<div class="answer-feedback wrong">
          <span class="feedback-icon">😜</span>
          <span><strong>Ối! Suýt nữa rồi!</strong> Bạn đúng ${r.correctUnits}/${r.totalUnits} ý. Cố thêm chút nữa nhé! 💪</span>
        </div>`;
  }
  return r.fullyCorrect
    ? `<div class="answer-feedback correct">
        <span class="feedback-icon">🎉</span>
        <span><strong>Chính xác!</strong> Bạn làm đúng rồi! Quá tuyệt! 🌟</span>
      </div>`
    : `<div class="answer-feedback wrong">
        <span class="feedback-icon">😜</span>
        <span><strong>Chưa đúng rồi!</strong> Câu này đang trêu bạn đấy 😆. Cố gắng ở câu tiếp theo nhé!</span>
      </div>`;
}

function renderContent(q) {
  const wrap = document.getElementById('contentWrap');
  if (!wrap) return;
  wrap.innerHTML = '';
  switch (q.type) {
    case 'single': renderSingle(q, wrap); break;
    case 'multiple': renderMultiple(q, wrap); break;
    case 'tf': renderTF(q, wrap); break;
    case 'group_tf': renderGroupTF(q, wrap); break;
    case 'match': renderMatch(q, wrap); break;
    case 'position': renderPosition(q, wrap); break;
  }
  const feedback = getAnswerFeedback(q);
  if (feedback) wrap.insertAdjacentHTML('beforeend', feedback);
}

function mockupHTML(name, width, height) {
  let src = IMAGES[name];
  if (!src) src = name;
  const parts = [];
  if (width) parts.push(`width:${width}px`);
  if (height) parts.push(`height:${height}px`);
  const wrapStyle = parts.length ? ` style="${parts.join(';')}"` : '';
  return `<div class="mockup-img-wrap"${wrapStyle}>${imgWithFallback(src, name, width, height)}</div>`;
}

function renderSingle(q, wrap) {
  const order = state.shuffleOrders[q.id] || q.options.map((_, i) => i);
  const isImageOpts = q.options.some(o => typeof o === 'string' && o.startsWith('img:'));
  const locked = isQuestionLocked(q);
  const answer = state.answers[q.id];

  let inner = '';
  if (isImageOpts) {
    inner += `<div class="option-grid-image">`;
    order.forEach(i => {
      const opt = q.options[i];
      const url = opt.replace('img:', '');
      const sel = answer === i;
      let resultClass = '';
      if (locked) {
        if (i === q.answer) resultClass = 'answer-correct';
        else if (sel) resultClass = 'answer-wrong';
      }
      const cardStyle = q.imageWidth ? ` style="width:${q.imageWidth}px"` : '';
      inner += `<div class="option-image-card ${sel ? 'selected' : ''} ${resultClass}" data-i="${i}"${cardStyle} aria-disabled="${locked}">
        ${imgWithFallback(url, 'option ' + (i + 1), q.imageWidth, q.imageHeight)}<input type="radio" name="single${q.id}" ${sel ? 'checked' : ''} ${locked ? 'disabled' : ''} style="pointer-events:none;"></div>`;
    });
    inner += `</div>`;
  } else {
    inner += `<div class="option-list">`;
    order.forEach(i => {
      const opt = q.options[i];
      const sel = answer === i;
      let resultClass = '';
      if (locked) {
        if (i === q.answer) resultClass = 'answer-correct';
        else if (sel) resultClass = 'answer-wrong';
      }
      inner += `<label class="option-row ${sel ? 'selected' : ''} ${resultClass}" data-i="${i}" aria-disabled="${locked}">
        <input type="radio" name="single${q.id}" ${sel ? 'checked' : ''} ${locked ? 'disabled' : ''}>
        <span class="opt-label">${opt}</span></label>`;
    });
    inner += `</div>`;
  }
  let mockup = q.mockup ? `<div class="single-media-box">${mockupHTML(q.mockup, q.imageWidth, q.imageHeight)}</div>` : '';
  wrap.innerHTML = mockup ? `<div class="single-with-media">${mockup}<div>${inner}</div></div>` : inner;
  wrap.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('click', () => {
      if (isQuestionLocked(q)) return;
      state.answers[q.id] = parseInt(el.getAttribute('data-i'));
      state.feedbackShown = false;
      renderContent(q);
      renderDots(q);
    });
  });
}
function renderMultiple(q, wrap) {
  const order = state.shuffleOrders[q.id] || q.options.map((_, i) => i);
  const cur = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : [];
  const locked = isQuestionLocked(q);
  const requiredCount = Array.isArray(q.answers) ? q.answers.length : 0;
  let inner = `<div class="option-list">`;
  order.forEach(i => {
    const opt = q.options[i];
    const sel = cur.includes(i);
    let resultClass = '';
    if (locked) {
      if (q.answers.includes(i)) resultClass = 'answer-correct';
      else if (sel) resultClass = 'answer-wrong';
    }
    inner += `<label class="option-row ${sel ? 'selected' : ''} ${resultClass}" data-i="${i}" aria-disabled="${locked}">
      <input type="checkbox" ${sel ? 'checked' : ''} ${locked ? 'disabled' : ''}>
      <span class="opt-label">${opt}</span></label>`;
  });
  inner += `</div>`;
  if (!locked && requiredCount > 0) inner += `<div class="answer-progress">Đã chọn <strong>${cur.length}/${requiredCount}</strong> đáp án</div>`;
  wrap.innerHTML = inner;
  wrap.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('click', () => {
      if (isQuestionLocked(q)) return;
      const i = parseInt(el.getAttribute('data-i'));
      let arr = Array.isArray(state.answers[q.id]) ? state.answers[q.id].slice() : [];
      const idx = arr.indexOf(i);
      if (idx >= 0) arr.splice(idx, 1);
      else {
        if (requiredCount > 0 && arr.length >= requiredCount) return;
        arr.push(i);
      }
      state.answers[q.id] = arr;
      state.feedbackShown = false;
      renderContent(q);
      renderDots(q);
    });
  });
}
function renderTF(q, wrap) {
  const cur = state.answers[q.id];
  const order = state.shuffleOrders[q.id] || [0, 1];
  const locked = isQuestionLocked(q);
  const btns = [
    `<div class="tf-btn ${cur === true ? 'selected' : ''} ${locked ? (q.answer === true ? 'answer-correct' : (cur === true ? 'answer-wrong' : '')) : ''}" data-v="true" aria-disabled="${locked}">Đúng</div>`,
    `<div class="tf-btn ${cur === false ? 'selected' : ''} ${locked ? (q.answer === false ? 'answer-correct' : (cur === false ? 'answer-wrong' : '')) : ''}" data-v="false" aria-disabled="${locked}">Sai</div>`
  ];
  wrap.innerHTML = `<div class="tf-buttons">${order.map(i => btns[i]).join('')}</div>`;
  wrap.querySelectorAll('[data-v]').forEach(el => {
    el.addEventListener('click', () => {
      if (isQuestionLocked(q)) return;
      state.answers[q.id] = el.getAttribute('data-v') === 'true';
      state.feedbackShown = false;
      renderContent(q);
    });
  });
}
function renderGroupTF(q, wrap) {
  const order = state.shuffleOrders[q.id] || q.items.map((_, i) => i);
  const cur = state.answers[q.id] || {};
  const locked = isQuestionLocked(q);
  let html = `<table class="group-tf-table"><thead><tr><th style="text-align:left;">&nbsp;</th><th>${q.labels[0]}</th><th>${q.labels[1]}</th></tr></thead><tbody>`;
  order.forEach(i => {
    const item = q.items[i], val = cur[i];
    const trueClass = locked ? (item.isTrue === true ? 'answer-correct' : (val === true ? 'answer-wrong' : '')) : '';
    const falseClass = locked ? (item.isTrue === false ? 'answer-correct' : (val === false ? 'answer-wrong' : '')) : '';
    html += `<tr><td class="statement">${item.text}</td>
      <td><div class="gtf-choice"><span class="gtf-radio ${val === true ? 'checked' : ''} ${trueClass}" data-i="${i}" data-v="true" aria-disabled="${locked}"></span></div></td>
      <td><div class="gtf-choice"><span class="gtf-radio ${val === false ? 'checked' : ''} ${falseClass}" data-i="${i}" data-v="false" aria-disabled="${locked}"></span></div></td></tr>`;
  });
  html += `</tbody></table>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('[data-i]').forEach(el => {
    el.addEventListener('click', () => {
      if (isQuestionLocked(q)) return;
      const i = parseInt(el.getAttribute('data-i'));
      const v = el.getAttribute('data-v') === 'true';
      let cur2 = state.answers[q.id] ? Object.assign({}, state.answers[q.id]) : {};
      cur2[i] = v;
      state.answers[q.id] = cur2;
      state.feedbackShown = false;
      renderContent(q); renderDots(q);
    });
  });
}
let dragLeftIndex = null;
let selectedLeftIndex = null;

function renderMatch(q, wrap) {
  const orders = state.shuffleOrders[q.id] || { left: q.left.map((_, i) => i), right: q.right.map((_, i) => i) };
  const leftOrder = orders.left, rightOrder = orders.right;
  let cur = state.answers[q.id] || {};
  const locked = isQuestionLocked(q);
  selectedLeftIndex = (selectedLeftIndex !== null && cur[selectedLeftIndex] === undefined) ? selectedLeftIndex : null;

  let html = `<div class="match-wrap">
    <div class="match-col left-col">
      <h3>Định nghĩa</h3>
      <div class="left-items">`;
  leftOrder.forEach(li => {
    const txt = q.left[li];
    const used = cur[li] !== undefined;
    const sel = selectedLeftIndex === li;
    const correctness = locked && used ? (cur[li] === q.correctMap[li] ? 'answer-correct' : 'answer-wrong') : '';
    html += `<div class="left-item ${used ? 'used' : ''} ${sel ? 'selected' : ''} ${correctness}" draggable="${!used && !locked}" data-li="${li}" aria-disabled="${locked}">${txt}</div>`;
  });
  html += `</div></div>
    <div class="match-col right-col">
      <h3>${q.left.length && q.right.some(r => r.capacity > 1) ? 'Thể loại' : 'Thuật ngữ'}</h3>`;

  const oneToOne = q.right.every(r => r.capacity === 1);
  if (oneToOne) {
    rightOrder.forEach(ri => {
      const r = q.right[ri];
      const filledLeft = Object.keys(cur).find(li => cur[li] === ri);
      const text = filledLeft !== undefined ? q.left[filledLeft] : 'Định nghĩa';
      html += `<div class="right-group-inline">
        <div class="right-group-label-inline">${r.label}</div>
        <div class="drop-slot ${filledLeft !== undefined ? 'filled' : ''}" data-ri="${ri}">${text}</div>
      </div>`;
    });
  } else {
    html += `<div class="right-groups-row">`;
    rightOrder.forEach(ri => {
      const r = q.right[ri];
      html += `<div class="right-group"><div class="right-group-label-col">${r.label}</div>`;
      for (let slot = 0; slot < r.capacity; slot++) {
        const filledLeft = Object.keys(cur).filter(li => cur[li] === ri)[slot];
        const text = filledLeft !== undefined ? q.left[filledLeft] : 'Định nghĩa';
        html += `<div class="drop-slot ${filledLeft !== undefined ? 'filled' : ''}" data-ri="${ri}" data-slot="${slot}" data-filledli="${filledLeft !== undefined ? filledLeft : ''}">${text}</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }
  html += `</div></div>`;
  wrap.innerHTML = html;

  wrap.querySelectorAll('.left-item').forEach(el => {
    const li = parseInt(el.getAttribute('data-li'));
    if (el.classList.contains('used')) return;
    el.addEventListener('click', () => {
      selectedLeftIndex = (selectedLeftIndex === li) ? null : li;
      renderContent(q);
    });
    el.addEventListener('dragstart', (e) => {
      dragLeftIndex = li;
      el.classList.add('dragging');
      e.dataTransfer.setData('text/plain', String(li));
    });
    el.addEventListener('dragend', () => { el.classList.remove('dragging'); dragLeftIndex = null; });
  });

  wrap.querySelectorAll('.drop-slot').forEach(el => {
    const ri = parseInt(el.getAttribute('data-ri'));
    el.addEventListener('dragover', (e) => { e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
    el.addEventListener('drop', (e) => {
      e.preventDefault(); el.classList.remove('drag-over');
      const li = dragLeftIndex !== null ? dragLeftIndex : parseInt(e.dataTransfer.getData('text/plain'));
      placeMatch(q, li, ri, el);
    });
    el.addEventListener('click', () => {
      const filledAttr = el.getAttribute('data-filledli');
      if (el.classList.contains('filled')) {
        let cur2 = Object.assign({}, state.answers[q.id] || {});
        const liToRemove = filledAttr !== '' && filledAttr !== null ? parseInt(filledAttr) :
          Object.keys(cur2).find(li => cur2[li] === ri);
        if (liToRemove !== undefined) delete cur2[liToRemove];
        state.answers[q.id] = cur2;
        state.feedbackShown = false;
        renderContent(q); renderDots(q);
        return;
      }
      if (selectedLeftIndex !== null) {
        placeMatch(q, selectedLeftIndex, ri, el);
        selectedLeftIndex = null;
      }
    });
  });
}

function placeMatch(q, li, ri, el) {
  if (isQuestionLocked(q)) return;
  if (li === null || li === undefined || isNaN(li)) return;
  let cur = Object.assign({}, state.answers[q.id] || {});
  const capacity = q.right[ri].capacity;
  const usedInRi = Object.keys(cur).filter(k => cur[k] === ri).length;
  if (usedInRi >= capacity) return;
  cur[li] = ri;
  state.answers[q.id] = cur;
  state.feedbackShown = false;
  renderContent(q);
  renderDots(q);
}

function renderPosition(q, wrap) {
  const inner = q.mockup ? mockupHTML(q.mockup, q.imageWidth, q.imageHeight) : (q.image ? imgWithFallback(q.image, 'position-image-' + q.id, q.imageWidth, q.imageHeight) : '');
  wrap.innerHTML = `<div class="position-wrap"><div class="position-target-area" id="posArea">${inner}</div></div>`;
  const area = document.getElementById('posArea');
  if (!area) return;

  const pos = state.clickPos[q.id];
  const locked = isQuestionLocked(q);
  if (pos) {
    const marker = document.createElement('div');
    marker.className = 'click-marker';
    marker.style.left = pos.x + '%';
    marker.style.top = pos.y + '%';
    area.appendChild(marker);
  }

  area.addEventListener('click', (e) => {
    if (isQuestionLocked(q)) return;
    const rect = area.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    state.clickPos[q.id] = { x, y };
    state.answers[q.id] = { x, y };
    state.feedbackShown = false;
    renderContent(q);
    renderDots(q);
  });
}

function isPointInTarget(pt, target) {
  return pt.x >= target.x && pt.x <= target.x + target.w &&
         pt.y >= target.y && pt.y <= target.y + target.h;
}

function evaluateQuestion(q) {
  const a = state.answers[q.id];
  if (q.type === 'single' || q.type === 'tf') {
    const correct = (q.type === 'single') ? (a === q.answer) : (a === q.answer);
    return { correctUnits: correct ? 1 : 0, totalUnits: 1, fullyCorrect: correct };
  }
  if (q.type === 'multiple') {
    if (!Array.isArray(a)) return { correctUnits: 0, totalUnits: 1, fullyCorrect: false };
    const setA = new Set(a), setB = new Set(q.answers);
    const equal = setA.size === setB.size && [...setA].every(v => setB.has(v));
    return { correctUnits: equal ? 1 : 0, totalUnits: 1, fullyCorrect: equal };
  }
  if (q.type === 'group_tf') {
    let correctUnits = 0;
    q.items.forEach((it, i) => { if (a && a[i] === it.isTrue) correctUnits++; });
    return { correctUnits, totalUnits: q.items.length, fullyCorrect: correctUnits === q.items.length };
  }
  if (q.type === 'match') {
    let correctUnits = 0;
    q.left.forEach((_, li) => { if (a && a[li] === q.correctMap[li]) correctUnits++; });
    return { correctUnits, totalUnits: q.left.length, fullyCorrect: correctUnits === q.left.length };
  }
  if (q.type === 'position') {
    const correct = a ? isPointInTarget(a, q.target) : false;
    return { correctUnits: correct ? 1 : 0, totalUnits: 1, fullyCorrect: correct };
  }
  return { correctUnits: 0, totalUnits: 1, fullyCorrect: false };
}

function computeScore() {
  let correctUnits = 0, totalUnits = 0, wrongQuestions = [];
  quizData.forEach(q => {
    const r = evaluateQuestion(q);
    totalUnits += 1;
    if (r.fullyCorrect) correctUnits += 1;
    if (!r.fullyCorrect) wrongQuestions.push(q);
  });
  return { correctUnits, totalUnits, wrongQuestions };
}

document.getElementById('btnNext').addEventListener('click', () => {

  // Chưa chọn đủ: chỉ cảnh báo, không khóa; học sinh tiếp tục làm được.
  if (!isAnswered(q) && !isQuestionLocked(q)) {
    state.feedbackShown = true;
    render();
    return;
  }

  // Đã chọn đủ: chấm và khóa ngay tại đây.
  if (!isQuestionLocked(q)) {
    state.lockedQuestions[q.id] = true;
    state.feedbackShown = true;
    render();
    return;
  }

  // Đã khóa và đã xem kết quả: bấm lần tiếp theo mới chuyển câu / hoàn thành.
  if (state.current === quizData.length - 1) {
    confirmAndFinish();
  } else {
    state.current++;
    state.feedbackShown = false;
    render();
  }
});

function resetSendScoreUI() {

function splitFullName(fullName) {
  const parts = (fullName || '').trim().split(/\s+/).filter(Boolean);
  if (parts.length === 0) return { hoTenDem: '', ten: '' };
  const ten = parts.pop();
  const hoTenDem = parts.join(' ');
  return { hoTenDem, ten };
}

function formatDateVN(d) {
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function formatTimeVN(d) {
  const hh = String(d.getHours()).padStart(2, '0');
  const mi = String(d.getMinutes()).padStart(2, '0');
  return `${hh}:${mi}`;
}

function formatDuration(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  let out = '';
  if (h > 0) out += h + 'h';
  if (h > 0 || m > 0) out += String(m).padStart(h > 0 ? 2 : 1, '0') + 'p';
  out += sec + 's';
  return out;
}

function sendQuizResult() {
  const statusEl = document.getElementById('sendStatus');
  const btn = document.getElementById('btnSendScore');
  if (!SERVER_CONFIG.url) {
    if (statusEl) {
      statusEl.textContent = '⚠ Chưa cấu hình URL gửi dữ liệu.';
      statusEl.style.color = 'var(--red)';
    }
    return;
  }
  if (state.hasSubmitted) {
    if (statusEl) {
      statusEl.textContent = '✅ Bài làm đã được nộp trước đó.';
      statusEl.style.color = 'var(--green)';
    }
    return;
  }

  const { correctUnits, totalUnits } = computeScore();
  const pct = totalUnits > 0 ? Math.round((correctUnits / totalUnits) * 100) : 0;
  const fileName = SERVER_CONFIG.fileName || (location.pathname.split('/').pop() || 'luyen_tap.html');

  const questionDetails = quizData.map((q, idx) => {
    const result = evaluateQuestion(q);
    return {
      questionNumber: idx + 1,
      questionId: q.id,
      questionType: q.type,
      questionText: q.question.substring(0, 50) + (q.question.length > 50 ? '...' : ''),
      isCorrect: result.fullyCorrect,
      score: result.correctUnits + '/' + result.totalUnits
    };
  });

  const now = new Date();
  const { hoTenDem, ten } = splitFullName(state.studentName);
  const durationSeconds = TOTAL_TIME - state.timeLeft;

  const payload = {
    school: state.studentSchool || SERVER_CONFIG.schoolName || '',
    hoTenDem: hoTenDem,
    ten: ten,
    studentClass: state.studentClass || '(Chưa chọn lớp)',
    fileName: fileName,
    score: `${correctUnits}`,
    dateStr: formatDateVN(now),
    timeStr: formatTimeVN(now),
    durationStr: formatDuration(durationSeconds),
    studentName: state.studentName || '(Chưa nhập tên)',
    percentage: `${pct}%`,
    totalCorrect: correctUnits,
    totalQuestions: totalUnits,
    timestamp: now.toISOString(),
    timeSpent: durationSeconds,
    questionDetails: questionDetails,
    rawAnswers: state.answers
  };

  if (btn) { btn.disabled = true; btn.textContent = '⏳ Đang gửi...'; }
  if (statusEl) {
    statusEl.textContent = '⏳ Đang nộp bài tới giáo viên...';
    statusEl.style.color = '#666';
  }

  fetch(SERVER_CONFIG.url, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(() => {
    state.hasSubmitted = true;
    if (statusEl) {
      statusEl.textContent = '✅ Nộp bài thành công! Giáo viên đã nhận được kết quả.';
      statusEl.style.color = 'var(--green)';
    }
    if (btn) { btn.disabled = false; btn.textContent = '✅ Đã nộp'; btn.style.opacity = '0.7'; }
  })
  .catch(err => {
    if (statusEl) {
      statusEl.textContent = '⚠ Nộp bài thất bại, vui lòng thử lại.';
      statusEl.style.color = 'var(--red)';
    }
    if (btn) { btn.disabled = false; btn.textContent = '📤 Nộp lại bài'; }
  });
}
document.getElementById('btnSendScore').addEventListener('click', sendQuizResult);

function renderResult() {
  const { correctUnits, totalUnits, wrongQuestions } = computeScore();
  const pct = totalUnits > 0 ? Math.round((correctUnits / totalUnits) * 100) : 0;
  const perfect = correctUnits === totalUnits;

  resetSendScoreUI();

  document.getElementById('trophyBox').innerHTML = perfect ? `<div class="trophy">🏆</div>` : '';
  document.getElementById('scoreBig').textContent = `${correctUnits}/${totalUnits} điểm (${pct}%)`;
  document.getElementById('scoreSub').textContent = perfect
    ? 'Xuất sắc! Bạn đã đạt điểm tuyệt đối.'
    : `Bạn đã trả lời đúng ${correctUnits} trên tổng số ${totalUnits} phần.`;

  const wrongList = document.getElementById('wrongList');
  if (wrongQuestions.length === 0) {
    wrongList.innerHTML = '';
  } else {
    let html = `<h3 style="margin-bottom:12px;">📝 Xem lại các câu chưa chính xác</h3>`;
    wrongQuestions.forEach(q => {
      const idx = quizData.findIndex(x => x.id === q.id);
      html += `<div class="wrong-item">
        <div class="wq-text">Câu ${idx + 1}: ${q.question}</div>
        <button data-id="${q.id}">🔍 Xem lại</button>
      </div>`;
    });
    wrongList.innerHTML = html;
    wrongList.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const q = quizData.find(x => x.id === parseInt(btn.getAttribute('data-id')));
        openReview(q);
      });
    });
  }
}

function openReview(q) {
  const box = document.getElementById('reviewBox');
  const a = state.answers[q.id];
  let html = `<h2>📖 Xem lại câu hỏi</h2><div class="question-text" style="margin-bottom:10px;">${q.question}</div>`;

  if (q.type === 'single') {
    html += `<div class="review-answer-line wrong">❌ Bạn chọn: ${a !== undefined ? optionLabelText(q, a) : '(chưa trả lời)'}</div>`;
    html += `<div class="review-answer-line correct">✅ Đáp án đúng: ${optionLabelText(q, q.answer)}</div>`;
  } else if (q.type === 'tf') {
    html += `<div class="review-answer-line wrong">❌ Bạn chọn: ${a === true ? 'Đúng' : a === false ? 'Sai' : '(chưa trả lời)'}</div>`;
    html += `<div class="review-answer-line correct">✅ Đáp án đúng: ${q.answer ? 'Đúng' : 'Sai'}</div>`;
  } else if (q.type === 'multiple') {
    const yourTxt = Array.isArray(a) ? a.map(i => q.options[i]).join('; ') : '(chưa trả lời)';
    const correctTxt = q.answers.map(i => q.options[i]).join('; ');
    html += `<div class="review-answer-line wrong">❌ Bạn chọn: ${yourTxt}</div>`;
    html += `<div class="review-answer-line correct">✅ Đáp án đúng: ${correctTxt}</div>`;
  } else if (q.type === 'group_tf') {
    q.items.forEach((it, i) => {
      const yourV = a ? a[i] : undefined;
      const ok = yourV === it.isTrue;
      html += `<div class="review-answer-line ${ok ? 'correct' : 'wrong'}">${it.text} — Bạn: ${yourV === undefined ? '(chưa)' : (yourV ? 'Đúng' : 'Sai')} | Đúng: ${it.isTrue ? 'Đúng' : 'Sai'}</div>`;
    });
  } else if (q.type === 'match') {
    q.left.forEach((txt, li) => {
      const yourRi = a ? a[li] : undefined;
      const correctRi = q.correctMap[li];
      const ok = yourRi === correctRi;
      html += `<div class="review-answer-line ${ok ? 'correct' : 'wrong'}">${txt} → Bạn: ${yourRi !== undefined ? q.right[yourRi].label : '(chưa)'} | Đúng: ${q.right[correctRi].label}</div>`;
    });
  } else if (q.type === 'position') {
    const ok = a ? isPointInTarget(a, q.target) : false;
    html += `<div class="review-answer-line ${ok ? 'correct' : 'wrong'}">${ok ? '✅ Bạn đã chọn đúng vị trí.' : '❌ Bạn đã chọn sai vị trí.'}</div>`;
    html += `<div style="position:relative;display:inline-block;margin-top:10px;">${q.mockup ? mockupHTML(q.mockup, q.imageWidth, q.imageHeight) : (q.image ? imgWithFallback(q.image, 'position-image-' + q.id, q.imageWidth, q.imageHeight) : '')}
      <div class="target-reveal" style="left:${q.target.x}%;top:${q.target.y}%;width:${q.target.w}%;height:${q.target.h}%;"></div>
      ${a ? `<div class="click-marker ${ok ? 'correct' : 'wrong'}" style="left:${a.x}%;top:${a.y}%;position:absolute;"></div>` : ''}
    </div>`;
  }

  html += `<div class="modal-actions"><button class="btn btn-primary" id="btnCloseReview">Đóng</button></div>`;
  box.innerHTML = html;
  document.getElementById('btnCloseReview').addEventListener('click', () => {
    document.getElementById('reviewModal').classList.add('hidden');
  });
  document.getElementById('reviewModal').classList.remove('hidden');
}

function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
}
function enterFullscreen() {
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
  if (req && !isFullscreen()) req.call(el).catch(() => {});
}
function exitFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
  if (exit && isFullscreen()) exit.call(document);
}
function toggleFullscreen() {
  if (isFullscreen()) exitFullscreen(); else enterFullscreen();
}
function updateFullscreenBtn() {
  const btn = document.getElementById('btnFullscreen');
  if (btn) btn.textContent = isFullscreen() ? '⤦' : '⛶';
}

document.getElementById('btnFullscreen').addEventListener('click', toggleFullscreen);
document.addEventListener('fullscreenchange', updateFullscreenBtn);
document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

document.getElementById('btnZoomIn').addEventListener('click', zoomIn);
document.getElementById('btnZoomOut').addEventListener('click', zoomOut);

loadStudentData();
</script>
